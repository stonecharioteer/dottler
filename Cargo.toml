[package]
name = "dottler"
version = "0.1.0"
edition = "2024"
authors = ["Vinay Keerthi <mail@stonecharioteer.com>"]
description = "Local environment variables for projects and git worktrees"
license = "MIT"
repository = "https://github.com/stonecharioteer/dottler"
homepage = "https://github.com/stonecharioteer/dottler"
readme = "README.md"
keywords = ["env", "dotenv", "secrets", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
